name: ios

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  XCODEGEN_VERSION: '2.40.1'

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: engine/go.sum

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install xcodegen
        run: |
          curl -fsSL "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip" -o /tmp/xcodegen.zip
          unzip -q /tmp/xcodegen.zip -d "$RUNNER_TEMP/xcodegen"
          XCODEGEN_BIN=$(find "$RUNNER_TEMP/xcodegen" -type f -name xcodegen | head -n 1)
          chmod +x "$XCODEGEN_BIN"
          echo "$(dirname "$XCODEGEN_BIN")" >> "$GITHUB_PATH"
          "$XCODEGEN_BIN" --version

      - name: Build engine xcframework (gomobile, requires macOS)
        working-directory: engine
        run: |
          mkdir -p bin
          go mod tidy
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260209203831-923679eb55af
          $(go env GOPATH)/bin/gomobile init
          $(go env GOPATH)/bin/gomobile bind -target=ios -ldflags="-s -w -checklinkname=0" \
            -o bin/Libbox.xcframework proxyclient.dev/engine/libbox
          if [ ! -d bin/Libbox.xcframework ]; then
            echo "xcframework build failed" >&2
            ls -la bin/ >&2 || true
            exit 1
          fi
          ls -la bin/Libbox.xcframework
          find bin/Libbox.xcframework -name "*.h" -print -exec cat {} \;

      - name: Disable Swift Package Manager (use CocoaPods plugin integration)
        run: flutter config --no-enable-swift-package-manager

      - name: Prepare iOS project
        run: bash app/ios/scripts/setup_ios.sh

      - name: Dump generated plugin registrant
        working-directory: app/ios
        run: |
          ls Runner/ | grep -i registrant || true
          echo "--- GeneratedPluginRegistrant.h ---"
          cat Runner/GeneratedPluginRegistrant.h 2>/dev/null || echo "(missing)"
          echo "--- GeneratedPluginRegistrant.m ---"
          cat Runner/GeneratedPluginRegistrant.m 2>/dev/null || echo "(missing)"

      - name: Dump iOS build settings
        if: always()
        working-directory: app/ios
        run: |
          echo "--- xcconfigs ---"
          for f in Flutter/*.xcconfig; do echo "### $f"; cat "$f"; done
          echo "### Pods-Runner.debug.xcconfig"
          sed -n '1,60p' "Pods/Target Support Files/Pods-Runner/Pods-Runner.debug.xcconfig" 2>/dev/null || echo "(missing)"
          echo "--- workspace ---"
          cat Runner.xcworkspace/contents.xcworkspacedata
          echo "--- effective settings ---"
          xcodebuild -workspace Runner.xcworkspace -scheme Runner -configuration Debug -showBuildSettings 2>/dev/null | grep -E "FRAMEWORK_SEARCH_PATHS|OTHER_LDFLAGS|PODS_|BUILD_DIR" || true

      - name: Analyze
        working-directory: app
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Test
        working-directory: app
        run: flutter test

      - name: Build iOS (no codesign, simulator, seeded shell entrypoint)
        working-directory: app/ios
        run: |
          xcodebuild -workspace Runner.xcworkspace -scheme Runner \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            FLUTTER_TARGET=lib/sim_seed_main.dart \
            CODE_SIGNING_ALLOWED=NO build

      - name: Launch on simulator and capture engine logs (diagnostic)
        if: always()
        working-directory: app/ios
        run: |
          xcrun simctl bootstatus "iPhone 15" -b 2>/dev/null || true
          APP=$(find "$HOME/Library/Developer/Xcode/DerivedData" -type d -path "*Debug-iphonesimulator/Relay.app" | head -n 1)
          echo "APP=$APP"
          echo "--- built Info.plist ---"
          plutil -p "$APP/Info.plist" || true
          xcrun simctl install "iPhone 15" "$APP" || true
          xcrun simctl launch "iPhone 15" dev.relay.app || true
          sleep 12
          xcrun simctl io "iPhone 15" screenshot /tmp/relay-sim-screen.png || true

          echo "--- Relay process log (last 2m, flutter lines) ---"
          xcrun simctl spawn "iPhone 15" log show --last 2m --predicate 'process == "Relay"' --style compact 2>/dev/null | grep -a 'flutter:' | tail -300 || true

      - name: Upload simulator screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relay-sim-screenshot
          path: /tmp/relay-sim-screen.png
          if-no-files-found: ignore

      - name: Build unsigned device IPA (for sideloading)
        working-directory: app/ios
        run: |
          xcodebuild -workspace Runner.xcworkspace -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Relay.xcarchive \
            CODE_SIGNING_ALLOWED=NO archive
          APPEX=build/Relay.xcarchive/Products/Applications/Relay.app/PlugIns/RelayTunnel.appex
          if [ ! -d "$APPEX" ]; then
            echo "::error::RelayTunnel.appex missing from archive - VPN will fail to start"
            find build/Relay.xcarchive/Products -maxdepth 4 | head -40
            exit 1
          fi
          echo "Embedded tunnel extension:"
          find build/Relay.xcarchive/Products/Applications/Relay.app/PlugIns -maxdepth 2 -print
          echo "Ad-hoc signing with entitlements so sideload re-signers (SideStore/AltStore) preserve them:"
          codesign --force --sign - \
            --entitlements PacketTunnel/PacketTunnel.entitlements \
            "$APPEX"
          codesign --force --sign - \
            --entitlements Runner/Runner.entitlements \
            build/Relay.xcarchive/Products/Applications/Relay.app
          echo "--- appex entitlements ---"
          codesign -d --entitlements - "$APPEX" 2>&1
          echo "--- app entitlements ---"
          codesign -d --entitlements - build/Relay.xcarchive/Products/Applications/Relay.app 2>&1
          if ! codesign -d --entitlements - "$APPEX" 2>&1 | grep -q "networkextension"; then
            echo "::error::RelayTunnel.appex has no networkextension entitlement - tunnel cannot launch"
            exit 1
          fi
          if ! codesign -d --entitlements - build/Relay.xcarchive/Products/Applications/Relay.app 2>&1 | grep -q "networkextension"; then
            echo "::error::Relay.app has no networkextension entitlement - tunnel cannot launch"
            exit 1
          fi
          mkdir -p build/Payload
          cp -R build/Relay.xcarchive/Products/Applications/Relay.app build/Payload/
          (cd build && zip -qry Relay.ipa Payload)
          ls -la build/Relay.ipa

      - name: Build minimal diagnostic IPA (pure Flutter, no plugins)
        working-directory: app/ios
        run: |
          xcodebuild -workspace Runner.xcworkspace -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Minimal.xcarchive \
            FLUTTER_TARGET=lib/minimal_main.dart \
            CODE_SIGNING_ALLOWED=NO archive
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R build/Minimal.xcarchive/Products/Applications/Relay.app build/Payload/
          (cd build && zip -qry RelayMinimal.ipa Payload)
          ls -la build/RelayMinimal.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: relay-unsigned-ipa
          path: app/ios/build/Relay.ipa
          if-no-files-found: error

      - name: Upload minimal diagnostic IPA
        uses: actions/upload-artifact@v4
        with:
          name: relay-minimal-ipa
          path: app/ios/build/RelayMinimal.ipa
          if-no-files-found: error
