name: ios

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  XCODEGEN_VERSION: '2.40.1'

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: engine/go.sum

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install xcodegen
        run: |
          curl -fsSL "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip" -o /tmp/xcodegen.zip
          unzip -q /tmp/xcodegen.zip -d "$RUNNER_TEMP/xcodegen"
          chmod +x "$RUNNER_TEMP/xcodegen/xcodegen"
          echo "$RUNNER_TEMP/xcodegen" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/xcodegen/xcodegen" --version

      - name: Build engine xcframework (gomobile, requires macOS)
        working-directory: engine
        run: |
          mkdir -p bin
          go mod tidy
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260209203831-923679eb55af
          $(go env GOPATH)/bin/gomobile init
          $(go env GOPATH)/bin/gomobile bind -target=ios -ldflags="-s -w -checklinkname=0" \
            -o bin/Libbox.xcframework proxyclient.dev/engine/libbox
          if [ ! -d bin/Libbox.xcframework ]; then
            echo "xcframework build failed" >&2
            ls -la bin/ >&2 || true
            exit 1
          fi
          ls -la bin/Libbox.xcframework

      - name: Prepare iOS project
        run: bash app/ios/scripts/setup_ios.sh

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Test
        working-directory: app
        run: flutter test

      - name: Build iOS (no codesign)
        working-directory: app/ios
        run: |
          xcodebuild -project Runner.xcodeproj -scheme Runner \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
