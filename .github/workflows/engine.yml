name: engine

on:
  push:
    paths: ['engine/**']
  pull_request:
    paths: ['engine/**']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: engine/go.sum

      - name: Tidy
        run: go mod tidy

      - name: Snapshot tidy state (temporary)
        run: |
          git diff -- go.mod > gomod.diff
          cp go.sum go.sum.snapshot

      - name: Upload tidy snapshot (temporary)
        uses: actions/upload-artifact@v4
        with:
          name: tidy-snapshot
          path: |
            engine/gomod.diff
            engine/go.sum.snapshot
          if-no-files-found: error

      - name: Vet
        run: go vet ./libbox/...

      - name: Test
        run: go test -race ./libbox/...

      - name: Check go.mod is tidy
        run: |
          if [ -n "$(git status --porcelain go.mod go.sum)" ]; then
            echo "go.mod/go.sum are not tidy after 'go mod tidy'"
            exit 1
          fi
