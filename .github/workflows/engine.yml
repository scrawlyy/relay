name: engine

on:
  push:
    paths: ['engine/**']
  pull_request:
    paths: ['engine/**']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: engine/go.sum

      - name: Tidy
        run: go mod tidy

      - name: Vet
        run: go vet ./libbox/...

      - name: Test
        run: go test -race ./libbox/...

      - name: Check go.mod is tidy
        run: |
          if [ -n "$(git status --porcelain go.mod go.sum)" ]; then
            echo "go.mod/go.sum are not tidy after 'go mod tidy'"
            exit 1
          fi
