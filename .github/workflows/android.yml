name: android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  JAVA_VERSION: '17'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/emulator /usr/local/lib/android/sdk/system-images || true
          df -h /

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: engine/go.sum

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Build engine AAR (gomobile)
        working-directory: engine
        env:
          ANDROID_MIN_SDK: 21
        run: |
          mkdir -p bin
          go mod tidy
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260209203831-923679eb55af
          $(go env GOPATH)/bin/gomobile init
          $(go env GOPATH)/bin/gomobile bind -target=android/arm64,android/arm -ldflags="-s -w -checklinkname=0" \
            -androidapi $ANDROID_MIN_SDK \
            -o bin/Libbox.aar proxyclient.dev/engine/libbox

      - name: Flutter pub get
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Test
        working-directory: app
        run: flutter test

      - name: Build APK
        working-directory: app
        run: flutter build apk --debug

      - name: Dump Libbox Java API
        if: always()
        run: |
          mkdir -p /tmp/aar && unzip -o engine/bin/Libbox.aar classes.jar -d /tmp/aar
          mkdir -p /tmp/aar/c && unzip -o /tmp/aar/classes.jar -d /tmp/aar/c
          javap -p -classpath /tmp/aar/c libbox.Libbox libbox.ProxyConfig libbox.ProbeResult libbox.TrafficListener
          SDK_JAR=$(find "$ANDROID_HOME/platforms" -name android.jar | sort | tail -1)
          echo "SDK_JAR=$SDK_JAR"
          javap -classpath "$SDK_JAR" 'android.net.VpnService$Builder'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: relay-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error