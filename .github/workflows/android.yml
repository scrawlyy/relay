name: android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  JAVA_VERSION: '17'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: engine/go.sum

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build engine AAR (gomobile)
        working-directory: engine
        run: |
          go mod tidy
          go install golang.org/x/mobile/cmd/gomobile@latest
          $(go env GOPATH)/bin/gomobile init
          $(go env GOPATH)/bin/gomobile bind -target=android/arm64,android/arm -ldflags="-s -w" \
            -o bin/Libbox.aar proxyclient.dev/engine/libbox

      - name: Flutter pub get
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Test
        working-directory: app
        run: flutter test

      - name: Build APK
        working-directory: app
        run: flutter build apk --debug -- -PrelayEngineAarPath=${{ github.workspace }}/engine/bin/Libbox.aar

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: relay-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
