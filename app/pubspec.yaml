name: relay_app
description: Relay — a premium, minimalist proxy client for iOS and Android.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.5.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  fl_chart: ^0.69.2
  intl: ^0.20.2
  uuid: ^4.5.1
  google_fonts: ^6.2.1
  haptic_engine:
    path: ../packages/haptic_engine
  vpn_platform:
    path: ../packages/vpn_platform

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
