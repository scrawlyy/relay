name: haptic_engine
description: Semantic haptics — iOS Taptic Engine and Android vibration effects via a single event API.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.5.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: dev.relay.haptic
        pluginClass: HapticEnginePlugin
